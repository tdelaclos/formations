name: Intégration temporaire des récapitulatifs

on:
  push:
    branches:
      - agent/integrer-images-recap

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrer-images-recap

      - name: Ajouter les références Markdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          docs = Path('sentinel/docs')
          changed = []
          linked = []

          for image in sorted(docs.glob('campagne_*/media/recap-*.png')):
              m = re.fullmatch(r'recap-(\d+\.\d+)\.png', image.name)
              if not m:
                  continue
              chapter = m.group(1)
              campaign_dir = image.parent.parent
              candidates = sorted(campaign_dir.glob(f'{chapter}-*.md'))
              if len(candidates) != 1:
                  raise SystemExit(f'{image}: chapitre {chapter}, candidats={candidates}')

              md = candidates[0]
              text = md.read_text(encoding='utf-8')
              rel = f'media/{image.name}'
              if rel in text:
                  linked.append((chapter, md, 'déjà présent'))
                  continue

              block = f'\n\n## Schéma récapitulatif\n\n![Récapitulatif du chapitre {chapter}]({rel})\n'

              # Comme les chapitres déjà illustrés : placer le schéma après la synthèse,
              # avant la navigation finale lorsqu'elle existe.
              nav = re.search(r'\n---\n\n(?=\[?[←⬅]|\*\*Chapitre précédent|Précédent)', text)
              if nav:
                  pos = nav.start()
                  text = text[:pos].rstrip() + block + '\n' + text[pos:].lstrip('\n')
              else:
                  text = text.rstrip() + block + '\n'

              md.write_text(text, encoding='utf-8')
              changed.append(md)
              linked.append((chapter, md, 'ajouté'))

          print(f'Images raccordées/analyées : {len(linked)}')
          for chapter, md, status in linked:
              print(f'{chapter}: {status} -> {md}')
          print(f'Fichiers modifiés : {len(changed)}')
          PY

      - name: Vérifier les références locales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          errors = []
          count = 0
          for md in Path('sentinel/docs').glob('campagne_*/*.md'):
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'!\[[^\]]*\]\((media/recap-[^)]+\.png)\)', text):
                  count += 1
                  if not (md.parent / target).is_file():
                      errors.append(f'{md}: cible absente {target}')
          print(f'Références recap vérifiées : {count}')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Publier les liens Markdown
        run: |
          if git diff --quiet; then
            echo "Aucun changement à publier"
            exit 0
          fi
          git config user.name "tdelaclos"
          git config user.email "t.delaclos@gmail.com"
          git add sentinel/docs/campagne_*/*.md
          git commit -m "Raccorder les images récapitulatives aux chapitres"
          git push origin HEAD:agent/integrer-images-recap
