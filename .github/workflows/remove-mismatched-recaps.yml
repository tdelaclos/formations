name: Nettoyage temporaire des récapitulatifs hors sujet

on:
  push:
    branches:
      - agent/integrer-images-recap

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrer-images-recap

      - name: Retirer les deux inclusions hors sujet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              Path('sentinel/docs/campagne_03/3.8-ip-sets-firewalld.md'): '3.8',
              Path('sentinel/docs/campagne_03/3.10-politique-reseau-sentinel.md'): '3.10',
          }
          for path, chapter in targets.items():
              text = path.read_text(encoding='utf-8')
              block = f'\n\n## Schéma récapitulatif\n\n![Récapitulatif du chapitre {chapter}](media/recap-{chapter}.png)\n'
              if block not in text:
                  raise SystemExit(f'Bloc attendu absent : {path}')
              path.write_text(text.replace(block, '\n', 1), encoding='utf-8')
              print(f'Retiré : {chapter} -> {path}')
          PY

      - name: Publier le nettoyage
        run: |
          git config user.name "tdelaclos"
          git config user.email "t.delaclos@gmail.com"
          git add sentinel/docs/campagne_03/3.8-ip-sets-firewalld.md sentinel/docs/campagne_03/3.10-politique-reseau-sentinel.md
          git commit -m "Écarter deux récapitulatifs hors sujet"
          git push origin HEAD:agent/integrer-images-recap
