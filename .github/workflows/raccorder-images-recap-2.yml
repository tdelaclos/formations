name: Raccordement temporaire images recap 2

on:
  push:
    branches:
      - agent/raccorder-images-recap-2

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raccorder-images-recap-2
          fetch-depth: 0

      - name: Raccorder les images aux chapitres
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chapters = {
              '3.8':  'sentinel/docs/campagne_03/3.8-ip-sets-firewalld.md',
              '3.10': 'sentinel/docs/campagne_03/3.10-politique-reseau-sentinel.md',
              '4.1':  'sentinel/docs/campagne_04/4.1-architecture-openssh.md',
              '4.3':  'sentinel/docs/campagne_04/4.3-authentification-par-cles.md',
              '4.4':  'sentinel/docs/campagne_04/4.4-durcissement-sshd-config.md',
              '4.5':  'sentinel/docs/campagne_04/4.5-bastion-administration.md',
              '12.1': 'sentinel/docs/campagne_12/12.1-centraliser-journaux-rsyslog.md',
              '12.2': 'sentinel/docs/campagne_12/12.2-auditer-systeme-auditd.md',
              '12.4': 'sentinel/docs/campagne_12/12.4-superviser-sentinel-prometheus.md',
              '12.5': 'sentinel/docs/campagne_12/12.5-concevoir-alertes-alertmanager.md',
              '13.1': 'sentinel/docs/campagne_13/13.1-reconnaissance.md',
              '13.4': 'sentinel/docs/campagne_13/13.4-escalade-privileges.md',
              '13.5': 'sentinel/docs/campagne_13/13.5-mouvements-lateraux.md',
              '13.6': 'sentinel/docs/campagne_13/13.6-persistance.md',
              '13.7': 'sentinel/docs/campagne_13/13.7-exfiltration.md',
              '13.8': 'sentinel/docs/campagne_13/13.8-etude-cas-complete.md',
          }

          changed = []
          for number, md_name in chapters.items():
              md = Path(md_name)
              image = md.parent / 'media' / f'recap-{number}.png'
              if not md.is_file():
                  raise SystemExit(f'Chapitre absent: {md}')
              if not image.is_file():
                  raise SystemExit(f'Image absente: {image}')

              text = md.read_text(encoding='utf-8')
              image_ref = f'media/recap-{number}.png'
              if image_ref in text:
                  print(f'{number}: déjà raccordé')
                  continue

              block = (
                  '\n\n## Schéma récapitulatif\n\n'
                  f'![Récapitulatif du chapitre {number}]({image_ref})\n'
              )
              md.write_text(text.rstrip() + block, encoding='utf-8')
              changed.append(str(md))
              print(f'{number}: ajouté')

          print(f'{len(changed)} chapitre(s) modifié(s)')
          PY

      - name: Vérifier les références images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          errors = []
          for md in Path('sentinel/docs').glob('campagne_*/*.md'):
              text = md.read_text(encoding='utf-8')
              for rel in re.findall(r'!\[[^\]]*\]\((media/recap-[^)]+\.png)\)', text):
                  if not (md.parent / rel).is_file():
                      errors.append(f'{md}: {rel}')
          if errors:
              raise SystemExit('Images introuvables:\n' + '\n'.join(errors))
          print('Toutes les images récapitulatives référencées existent.')
          PY

      - name: Construire MkDocs
        run: |
          python3 -m pip install --quiet mkdocs mkdocs-mermaid2-plugin
          mkdocs build -f sentinel/mkdocs.yml

      - name: Publier les raccordements
        run: |
          git config user.name "tdelaclos"
          git config user.email "t.delaclos@gmail.com"
          git add sentinel/docs/campagne_03 sentinel/docs/campagne_04 sentinel/docs/campagne_12 sentinel/docs/campagne_13
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Raccorder les nouvelles images récapitulatives"
          git push origin HEAD:agent/raccorder-images-recap-2
