name: Finalisation documentaire temporaire

on:
  push:
    branches:
      - agent/harmonisation-finale-docs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Normaliser le blanc avant Vous êtes ici
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('sentinel/docs').glob('campagne_*/*.md'):
              if not re.match(r'^\d+\.\d+-.*\.md$', path.name):
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'(?<!\n)\n## Vous êtes ici\n', '\n\n## Vous êtes ici\n', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Vérifier le formalisme et les images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          errors = []
          count = 0
          fence = re.compile(r'```.*?```', re.S)
          for path in Path('sentinel/docs').glob('campagne_*/*.md'):
              if not re.match(r'^\d+\.\d+-.*\.md$', path.name):
                  continue
              count += 1
              text = path.read_text(encoding='utf-8')
              h2 = re.findall(r'^## (.+)$', text, re.M)
              if h2[:3] != ['Vous êtes ici', 'Objectifs pédagogiques', 'Pourquoi ce chapitre existe']:
                  errors.append(f'{path}: premiers H2 incorrects: {h2[:3]}')
              if '## Infographie de révision' in text:
                  errors.append(f'{path}: ancienne infographie encore présente')
              visible = fence.sub('', text)
              h1 = re.findall(r'^# (?!#)(.+)$', visible, re.M)
              if len(h1) != 1:
                  errors.append(f'{path}: {len(h1)} H1 hors blocs de code')
              if not re.search(r'\n\n## Vous êtes ici\n', text):
                  errors.append(f'{path}: séparation du cartouche non normalisée')
              for target in re.findall(r'!\[[^\]]*\]\(([^)]+)\)', text):
                  if '://' in target or target.startswith('#'):
                      continue
                  target = target.split('#', 1)[0]
                  if not (path.parent / target).exists():
                      errors.append(f'{path}: image absente: {target}')
          print(f'{count} chapitres vérifiés')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Construire MkDocs
        run: |
          python3 -m pip install --disable-pip-version-check mkdocs mkdocs-mermaid2-plugin
          mkdocs build -f sentinel/mkdocs.yml

      - name: Enregistrer la correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel/docs
          if ! git diff --cached --quiet; then
            git commit -m 'Finaliser le formalisme des ouvertures de chapitre'
            git push
          fi
