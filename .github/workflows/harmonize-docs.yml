name: Harmonisation documentaire temporaire

on:
  push:
    branches:
      - agent/harmonisation-finale-docs

permissions:
  contents: write

jobs:
  harmonize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Harmoniser les chapitres et produire l'audit Mermaid
        run: python3 .github/scripts/harmonize_docs.py

      - name: Vérifier les références d'images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('sentinel/docs')
          errors = []
          for md in root.glob('campagne_*/*.md'):
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'!\[[^\]]*\]\(([^)]+)\)', text):
                  if '://' in target or target.startswith('#'):
                      continue
                  target = target.split('#', 1)[0]
                  if not (md.parent / target).exists():
                      errors.append(f'{md}: image absente: {target}')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Construire la documentation MkDocs
        run: |
          python3 -m pip install --disable-pip-version-check mkdocs mkdocs-mermaid2-plugin
          mkdocs build -f sentinel/mkdocs.yml

      - name: Enregistrer les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel/docs mermaid-audit.md
          if ! git diff --cached --quiet; then
            git commit -m 'Harmoniser la structure des chapitres'
            git push
          fi
